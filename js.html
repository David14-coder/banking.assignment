    <meta charset="UTF-8" />

  <body>

  <script>
    let balance = 50000;
    let transactions = [];

    let correctPin = "1234";
    let attempts = 0;
    let loggedIn = false;

    while (attempts < 3) {
      let pin = prompt("Enter your PIN:");

      if (pin === correctPin) {
        console.log("Login successful");
        loggedIn = true;
        break;
      } else {
        attempts++;
        alert("Incorrect PIN");
      }
    }

    // Check if account should be blocked
    if (!loggedIn) {
      console.log("Too many incorrect attempts.");
      console.log("Account temporarily blocked.");
    } else {
      let choice;

      do {
        choice = prompt(`
        WELCOME TO SIMPLE BANK

        1. Check Balance
        2. Deposit Money
        3. Withdraw Money
        4. View Transactions
        5. Exit

        Enter your choice:
        `);
        if (choice === "1") {
          console.log(`your balance is ${balance}`);

          transactions.push(`40000`);

          //   2: Deposit Money
        } else if (choice === "2") {
          let deposit = Number(prompt("How much do you want to deposit"));

          if (deposit > 0) {
            balance += deposit;

            transactions.push(`deposit ${balance}`);

            console.log("deposit successful");
            console.log(`New balance ${balance}`);
          } else {
            console.log("invalid deposit amount");
          }
        }

        // 3: Withdraw Money
        if (choice === "3") {
          let withdrawal = Number(prompt("How much do you want to withdraw"));

          if ("withdrawal <= 0") {
            console.log("invalid withdrawal amount.");
          } else if (withdrawal > balance) {
            console.log("insufficient balance.");
          } else {
            balance -= withdrawal;

            transactions.push(`withdrawn ${balance}`);

            console.log("withdrawal successful");
            console.log(`New balance: ${balance}`);
          }
        }

        // view transactions
        else if (choice === "4") {
          if (transactions.length === 0) {
            console.log("No transaction yet");
          } else {
            console.log("Transaction History:");

            for (let transaction of transactions) {
              console.log(Transaction);
            }
          }
        }

        // exit
        else if (choice === "5") {
          console.log("Thank you for using SIMPLE BANK!");
        } else {
          console.log("invalid choice, please select 1-5.");
        }
      } while (choice !== "5");
    }
  </script>
